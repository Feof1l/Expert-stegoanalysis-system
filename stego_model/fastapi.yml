  services:
    stego-model:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: stego-model
      restart: unless-stopped
      ports:
        - "8000:8000"
      volumes:
        - ../stego_model:/app:ro  
      env_file: "../.env"
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/docs"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
