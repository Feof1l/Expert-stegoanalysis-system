<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Login</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required />
      </div>
      <div id="loginAlert" class="alert" style="display: none;"></div>
      <button type="submit">Login</button>
    </form>
    <div class="auth-footer">
      <a href="/auth/register.html">Create an account</a> |
      <a href="/auth/reset-password.html">Forgot password?</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("loginAlert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const formData = new FormData(form);
      const body = Object.fromEntries(formData);

      try {
        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await resp.json();

        if (resp.ok) {
          alertBox.className = "alert alert-success";
          alertBox.textContent = "Login successful. Redirecting...";
          alertBox.style.display = "block";
          setTimeout(() => {
            window.location.href = "/"; // перенаправление на главную
          }, 800);
        } else {
          alertBox.className = "alert alert-error";
          alertBox.textContent = data.error || "Login failed";
          alertBox.style.display = "block";
        }
      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.textContent = "Network error: " + err.message;
        alertBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
