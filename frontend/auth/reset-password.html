<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Change Password</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Change Password</h1>
    <form id="resetForm">
      <div class="form-group">
        <label for="resetUsername">Username</label>
        <input type="text" id="resetUsername" name="username" required />
      </div>
      <div class="form-group">
        <label for="resetOldPassword">Current Password</label>
        <input type="password" id="resetOldPassword" name="oldPassword" required />
      </div>
      <div class="form-group">
        <label for="resetNewPassword">New Password</label>
        <input type="password" id="resetNewPassword" name="newPassword" required />
      </div>
      <div class="form-group">
        <label for="resetConfirmNewPassword">Confirm New Password</label>
        <input type="password" id="resetConfirmNewPassword" name="confirmNewPassword" required />
      </div>
      <div id="resetAlert" class="alert" style="display: none;"></div>
      <button type="submit">Change Password</button>
    </form>
    <div class="auth-footer">
      <a href="/auth/login.html">Back to login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("resetAlert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const newPassword = form.resetNewPassword.value;
      const confirmNewPassword = form.resetConfirmNewPassword.value;

      if (newPassword !== confirmNewPassword) {
        alertBox.className = "alert alert-error";
        alertBox.textContent = "New passwords do not match";
        alertBox.style.display = "block";
        return;
      }

      const formData = new FormData(form);
      const body = {
        username: formData.get("username"),
        oldPassword: formData.get("oldPassword"),
        newPassword: formData.get("newPassword"),
      };

      try {
        const resp = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await resp.json();

        if (resp.ok) {
          alertBox.className = "alert alert-success";
          alertBox.textContent = "Password changed successfully. Redirecting to login...";
          alertBox.style.display = "block";
          setTimeout(() => {
            window.location.href = "/auth/login.html";
          }, 1000);
        } else {
          alertBox.className = "alert alert-error";
          alertBox.textContent = data.error || "Password change failed";
          alertBox.style.display = "block";
        }
      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.textContent = "Network error: " + err.message;
        alertBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
