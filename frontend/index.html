<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Steganalysis Expert System</title>
  <style>
    :root {
      --bg: #000;
      --text: #eee;
      --accent: #00aa00;
      --accent-light: #00cc00;
      --border: #222;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--accent-light);
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #080808;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-light);
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #111;
      color: var(--text);
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      background: #333;
      cursor: not-allowed;
      opacity: 0.6;
    }
    button:hover:not(:disabled) {
      background: var(--accent-light);
    }
    .preview {
      margin-top: 16px;
      text-align: center;
    }
    .preview img {
      max-width: 100%;
      max-height: 300px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .result {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #0a0a0a;
      display: none;
    }
    .result.show {
      display: block;
    }
    .result.success {
      border-color: var(--accent);
    }
    .result.error {
      border-color: #aa0000;
    }
  </style>
</head>
<body>
  <header>
    <h1>Development of an Intelligent Expert System for Steganalysis of Digital Images</h1>
  </header>

  <main>
    <div class="form-group">
      <label for="image">Upload image (JPG, PNG, BMP)</label>
      <input type="file" id="image" accept=".jpg,.jpeg,.png,.bmp" />
    </div>

    <button id="analyze" disabled>Check image</button>

    <div class="preview" id="preview"></div>

    <div class="result" id="result"></div>
  </main>

  <script>
    const imageInput = document.getElementById("image");
    const analyzeBtn = document.getElementById("analyze");
    const preview = document.getElementById("preview");
    const resultBox = document.getElementById("result");

    // Пока файл не выбран, кнопка неактивна
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (file) {
        analyzeBtn.disabled = false;

        // Показ превью
        preview.innerHTML = "";
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      } else {
        analyzeBtn.disabled = true;
        preview.innerHTML = "";
      }
      resultBox.classList.remove("show");
    });

    analyzeBtn.addEventListener("click", async () => {
      const file = imageInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);

      resultBox.classList.remove("success", "error");
      resultBox.classList.add("show");
      resultBox.textContent = "Processing...";

      try {
        const resp = await fetch("/api/analyze", {
          method: "POST",
          body: formData,
        });

        const data = await resp.json();

        if (resp.ok) {
          resultBox.classList.add("success");
          resultBox.innerHTML = `
            <strong>Result:</strong> ${data.result}<br/>
            <strong>Confidence:</strong> ${(data.confidence * 100).toFixed(2)}%
          `;
        } else {
          resultBox.classList.add("error");
          resultBox.textContent = "Error: " + (data.error || "Unknown error");
        }
      } catch (err) {
        resultBox.classList.add("error");
        resultBox.textContent = "Network error: " + err.message;
      }
    });
  </script>
</body>
</html>
