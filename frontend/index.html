<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stego Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="auth-container" class="container auth-container">
    <nav class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Register</button>
      <button class="tab" data-tab="change-password">Change Password</button>
    </nav>

    <section id="login-form" class="form active">
      <h2>Sign In</h2>
      <form>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required />
        </div>
        <div id="login-alert" class="alert"></div>
        <button type="submit" class="animated-button login-btn">
          <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
          <span class="text">Sign In</span>
          <span class="circle"></span>
          <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
        </button>
      </form>
    </section>

    <section id="register-form" class="form">
      <h2>Create Account</h2>
      <form>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" required />
        </div>
        <div class="form-group">
          <label for="register-name">Name</label>
          <input type="text" id="register-name" name="name" required />
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required />
        </div>
        <div class="form-group">
          <label for="register-confirm-password">Confirm Password</label>
          <input type="password" id="register-confirm-password" required />
        </div>
        <div id="register-alert" class="alert"></div>
        <button type="submit" class="animated-button register-btn">
          <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
          <span class="text">Create Account</span>
          <span class="circle"></span>
          <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
        </button>
      </form>
    </section>

    <section id="change-password-form" class="form">
      <h2>Change Password</h2>
      <form>
        <div class="form-group">
          <label for="old-password">Current Password</label>
          <input type="password" id="old-password" name="old_password" required />
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="new_password" required />
        </div>
        <div id="change-password-alert" class="alert"></div>
        <button type="submit" class="animated-button change-password-btn">
          <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
          <span class="text">Change Password</span>
          <span class="circle"></span>
          <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"></path>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <main id="dashboard-container" class="container dashboard-container hidden">
    <header class="dashboard-header">
      <h1>Development of Intelligent Expert System for Steganalysis of Digital Images</h1>
      <button id="logout-btn" class="Btn">
        <div class="sign">
          <svg viewBox="0 0 512 512">
            <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
          </svg>
        </div>
        <div class="text">Logout</div>
      </button>
    </header>

    <section class="upload-section">
      <div class="form-group">
        <label for="image-input">Select Image for Analysis</label>
        <input type="file" id="image-input" accept="image/*" />
      </div>

      <div class="preview">
        <img id="preview-image" alt="Image Preview" />
      </div>

      <button id="check-btn" class="analyze-btn">Analyze Image</button>
      
      <div id="result" class="result">
        Select an image to begin analysis
      </div>
    </section>
  </main>

  <script>
    const BACKEND_URL = "http://localhost:8080";

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
        clearAlerts();
      });
    });

    async function apiRequest(url, data, token = null) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch(BACKEND_URL + url, {
        method: "POST",
        headers,
        body: JSON.stringify(data)
      });

      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Server error");
      return json;
    }

    function showAlert(id, message, type = 'error') {
      const alert = document.getElementById(id);
      alert.textContent = message;
      alert.className = `alert alert-${type}`;
      alert.style.display = 'block';
    }

    function clearAlerts() {
      document.querySelectorAll('.alert').forEach(a => a.style.display = 'none');
    }

    document.getElementById('login-form').addEventListener('submit', handleLogin);
    document.getElementById('register-form').addEventListener('submit', handleRegister);
    document.getElementById('change-password-form').addEventListener('submit', handleChangePassword);
    document.getElementById('logout-btn').addEventListener('click', handleLogout);
    document.getElementById('image-input').addEventListener('change', handleImagePreview);
    document.getElementById('check-btn').addEventListener('click', handleAnalyze);

    async function handleLogin(e) {
      e.preventDefault();
      clearAlerts();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      try {
        const res = await apiRequest('/login', data);
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        showDashboard();
      } catch (err) {
        showAlert('login-alert', err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearAlerts();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      if (data.password !== document.getElementById('register-confirm-password').value) {
        showAlert('register-alert', 'Passwords do not match');
        return;
      }
      try {
        const res = await apiRequest('/register', data);
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        showDashboard();
      } catch (err) {
        showAlert('register-alert', err.message);
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      clearAlerts();
      const token = localStorage.getItem('token');
      if (!token) {
        showAlert('change-password-alert', 'Please login first');
        return;
      }
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      try {
        await apiRequest('/api/change-password', data, token);
        showAlert('change-password-alert', 'Password changed successfully', 'success');
      } catch (err) {
        showAlert('change-password-alert', err.message);
      }
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      showAuth();
    }

    function handleImagePreview(e) {
      const file = e.target.files[0];
      const img = document.getElementById('preview-image');
      if (file) {
        const url = URL.createObjectURL(file);
        img.src = url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    async function handleAnalyze() {
      const file = document.getElementById('image-input').files[0];
      if (!file) {
        document.getElementById('result').textContent = 'Пожалуйста, выберите изображение';
        return;
      }

      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('result').textContent = 'Необходимо авторизоваться';
        return;
      }

      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Анализ изображения...';

      try {
        const formData = new FormData();
        formData.append('image', file);

        const response = await fetch(`${BACKEND_URL}/api/analyze`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await response.json();
        
        if (response.ok) {
          const prob = (data.stego_prob * 100).toFixed(1);
          resultDiv.innerHTML = `
            <div class="analysis-result">
              <h3>Результат анализа</h3>
              <p>Вероятность стеганографии: <strong>${prob}%</strong></p>
              <p>${data.result}</p>
            </div>
          `;
        } else {
          resultDiv.textContent = data.error || 'Ошибка анализа';
        }
      } catch (error) {
        resultDiv.textContent = 'Ошибка соединения с сервером';
        console.error('Analyze error:', error);
      }
    }

    function showDashboard() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('dashboard-container').classList.remove('hidden');
    }

    function showAuth() {
      document.getElementById('auth-container').classList.remove('hidden');
      document.getElementById('dashboard-container').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (token) showDashboard();
    });
  </script>
</body>
</html>
